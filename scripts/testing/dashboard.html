<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FormRefine · 测试台</title>
<style>
:root{color-scheme:light;--ink:#182633;--muted:#68788b;--line:#e0e7ef;--green:#087b61;--red:#c13d53;--amber:#9a660b}*{box-sizing:border-box}body{margin:0;background:#eff3f8;color:var(--ink);font:14px/1.6 "Avenir Next","PingFang SC",sans-serif}header{height:78px;background:#111f32;color:#fff;padding:0 5vw;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #ffffff12}header strong{font-size:21px;letter-spacing:-.5px}header strong:before{content:'◈';display:inline-block;margin-right:12px;color:#67e2c1;font-size:27px}header span{color:#a9bbcd;font-size:13px}main{max-width:1550px;margin:auto;padding:36px 5vw}h1{font-size:34px;letter-spacing:-1px;margin:0;line-height:1.3}h2{font-size:17px;margin:0 0 12px}p{margin:8px 0;color:var(--muted)}.intro{display:flex;justify-content:space-between;align-items:center;gap:24px;margin-bottom:26px}.intro>div{max-width:770px}.intro p{max-width:670px}.status{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:6px;font-size:12px;font-weight:600;background:#e8edf3;white-space:nowrap}.status:before{content:'•';font-size:15px;line-height:1}.passed{color:#087359;background:#e0f3eb}.failed,.interrupted{color:#b12b46;background:#ffe6eb}.skipped{color:#8e641b;background:#fff0d8}.running{color:#2664aa;background:#e2efff}.layout{display:grid;grid-template-columns:220px minmax(0,1fr);gap:28px}.history{display:grid;gap:9px;max-height:580px;overflow:auto;padding-right:4px}.history button{text-align:left;width:100%;border:1px solid transparent;border-left:3px solid #ccd6e2;border-radius:0 10px 10px 0;background:#ffffff90;padding:13px;color:var(--ink);cursor:pointer;transition:background .15s,border-color .15s}.history button:hover{background:#fff}.history button[aria-pressed=true]{border-left-color:#087b61;background:#fff;box-shadow:0 5px 14px #183b6210}.history strong{font-size:12px;font-variant-numeric:tabular-nums}.history small{display:block;color:var(--muted);font-size:11px;margin-top:4px}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:18px 0}.stats>span{padding:17px 20px;background:#fff;border:1px solid var(--line);border-radius:12px;font-size:12px;color:var(--muted);box-shadow:0 3px 7px #213e5c04}.stats b{font-size:30px;display:block;color:var(--ink);font-weight:600;line-height:1.3;font-variant-numeric:tabular-nums;margin-bottom:6px}.stats>span:first-child b{color:var(--green)}.stats>span:nth-child(2) b{color:var(--red)}.toolbar{display:flex;gap:12px;margin:24px 0 14px;flex-wrap:wrap}input,select,button{font:inherit}input,select{border:1px solid var(--line);border-radius:9px;padding:12px 14px;background:#fff;color:var(--ink)}input{flex:1;min-width:180px}button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible,a:focus-visible{outline:3px solid #d68c1b;outline-offset:3px}.group{border:1px solid var(--line);border-radius:12px;background:#fff;margin-bottom:10px;overflow:hidden;transition:box-shadow .15s}.group:hover{box-shadow:0 5px 16px #183b6209}.group>summary{display:flex;gap:14px;align-items:center;padding:17px 18px;cursor:pointer;list-style:none}.group>summary::-webkit-details-marker{display:none}.group>summary:before{content:'›';font-size:21px;color:#8495a8;transition:transform .15s}.group[open]>summary:before{transform:rotate(90deg)}.group[open]>summary{background:#f8fafc}.group summary strong{flex:1;font-size:14px}.group>summary>span:last-child{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}.body{padding:0 20px 20px}.body>p{padding:10px 0}.cases{width:100%;border-collapse:collapse;font-size:13px}.cases td,.cases th{padding:13px 8px;border-top:1px solid var(--line);text-align:left;vertical-align:top}.cases th{color:var(--muted);font-weight:500;font-size:12px}.cases td:first-child{width:105px}.cases tbody tr:hover{background:#f8fbfd}.case-id{display:block;color:#8795a6;font:10px/1.6 monospace;overflow-wrap:anywhere;margin-top:5px}pre{white-space:pre-wrap;overflow-wrap:anywhere;max-height:420px;overflow:auto;background:#152438;color:#d8e4ef;border-radius:8px;padding:16px;font:12px/1.7 monospace}a{color:var(--green);text-underline-offset:3px}.command{border:1px solid var(--line);border-radius:12px;background:#e5ecf3;padding:16px;margin-top:24px}.command strong{font-size:13px}.command code{display:block;overflow-wrap:anywhere;font-size:11px;margin-top:10px;padding:10px;background:#17283b;color:#c7f3e3;border-radius:6px}.note{font-size:12px;line-height:1.8}.empty{padding:40px;text-align:center;border:1px dashed #bac9d9;border-radius:12px;color:var(--muted)}footer{margin-top:35px;color:var(--muted);font-size:11px;border-top:1px solid var(--line);padding-top:20px}.run-meta{font-size:11px;overflow-wrap:anywhere;font-family:monospace;color:#7e8c9c}.visuals{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:22px 0}.overview{background:radial-gradient(ellipse at top right,#244a53 0,transparent 68%),#14263b;color:#fff;border-radius:16px;padding:24px;display:flex;align-items:center;gap:25px;min-height:195px;position:relative;overflow:hidden}.overview h2{font-size:16px}.overview p{color:#b2c3d3;font-size:12px}.ring{width:124px;height:124px;border-radius:50%;flex:none;display:grid;place-items:center;position:relative;box-shadow:0 0 35px #68dfbf0b}.ring:before{content:'';position:absolute;inset:10px;border-radius:50%;background:#172c40}.ring b{position:relative;font-size:30px;font-weight:500;letter-spacing:-1px}.trend{background:#fff;border:1px solid var(--line);border-radius:16px;padding:22px}.trend h2{font-size:14px}.trend p{font-size:11px;margin:4px 0}.trend-bars{display:flex;align-items:end;gap:9px;height:90px;border-bottom:1px solid var(--line);padding-bottom:6px}.trend-bar{flex:1;max-width:56px;min-width:8px;border:0;background:#87c8b7;border-radius:5px 5px 2px 2px;cursor:pointer;position:relative;transition:filter .15s}.trend-bar:hover{filter:brightness(.85)}.trend-bar[data-state=failed],.trend-bar[data-state=interrupted]{background:#e88394}.trend-bar[data-state=running]{background:#7fa8de}.trend-bar[aria-pressed=true]{outline:2px solid #173e38;outline-offset:3px}.module-map{grid-column:1/-1;padding:20px 22px;background:#fff;border:1px solid var(--line);border-radius:14px}.module-map h2{font-size:14px;margin-bottom:3px}.module-map>p{font-size:11px;margin-bottom:15px}.module-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:15px}.module{padding:0;text-align:left;border:0;background:none;color:#4f6275;cursor:pointer;font-size:11px}.module>span{display:flex;justify-content:space-between;gap:8px}.module-track{height:6px;border-radius:3px;margin-top:8px;background:#e5ebf2;display:flex;overflow:hidden}.module-segment{height:100%;display:block;background:#2aab86}.module-segment[data-state=failed]{background:#df6a82}.module-segment[data-state=skipped]{background:#e3bb72}.module-segment[data-state=running]{background:#7fa8de}.module-segment[data-state=pending]{background:#c5ced9}.module-segment[data-state=interrupted]{background:#df6a82}.chart-legend{display:flex;gap:16px;margin-top:15px;font-size:10px;color:#7b8998}.chart-legend span:before{content:'';width:7px;height:7px;border-radius:50%;display:inline-block;margin-right:5px;background:#2aab86}.chart-legend span:nth-child(2):before{background:#df6a82}.chart-legend span:nth-child(3):before{background:#e3bb72}@media(max-width:1050px){.visuals{grid-template-columns:1fr}.module-grid{grid-template-columns:repeat(3,minmax(0,1fr))}.layout{grid-template-columns:190px minmax(0,1fr)}.stats{gap:8px}.stats>span{padding:14px}}@media(max-width:750px){header{padding:18px;height:auto}header span{display:none}main{padding:24px 18px}.intro{align-items:start}.intro h1{font-size:25px}.intro p{font-size:12px}.layout{grid-template-columns:1fr}.history{display:flex;overflow:auto;padding-bottom:8px;max-height:none}.history button{min-width:180px;width:auto}.command{display:none}.overview{padding:24px;min-height:170px}.ring{width:105px;height:105px}.module-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.cases th:last-child,.cases td:last-child{display:none}.group>summary{flex-wrap:wrap;gap:9px}.group summary strong{min-width:45%}.group>summary>span:last-child{margin-left:25px}.body{padding:0 12px 16px}.cases{font-size:12px}.cases td:first-child{width:78px}.cases .status{font-size:10px;padding:3px 6px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<header><strong>FormRefine / 测试台</strong><span>本地回归与持续集成</span></header><main>
<section class="intro"><div><h1>让每次发布，都心中有数。</h1><p>从匿名试用到个人训练记录，查看实际执行的用例与结果。未执行的检查会明确标记，不计入通过数量。</p></div><div id="runBadge"></div></section>
<div class="layout"><aside><h2>运行历史</h2><div class="history" id="history"></div><div class="command"><strong>运行测试</strong><code>venv/bin/python scripts/verify_site.py</code><p class="note">页面只展示结果，不执行系统命令。测试过程中刷新此页可查看进度。</p><a href="summary.json">下载最近结果 JSON</a></div></aside>
<section><h2 id="runTitle"></h2><p class="run-meta" id="meta"></p><div class="visuals" id="visuals"></div><div class="stats" id="stats"></div><div class="toolbar"><input id="search" aria-label="搜索测试用例" placeholder="搜索用例、模块或失败原因…"><select id="filter" aria-label="筛选状态"><option value="all">全部状态</option><option value="failed">只看失败</option><option value="passed">只看通过</option><option value="skipped">未执行 / 跳过</option><option value="running">执行中</option></select></div><div id="groups"></div><p class="note">边界：不包含真实注册邮件、真实支付回调、生产部署或压力测试。账号流程使用隔离数据；前端流程测试不等于完整浏览器端到端测试。</p></section></div>
<footer>所有时间按当前设备时区显示。历史保留最近 40 次展示，原始结果与日志保存在各次运行目录。</footer></main>
<script id="report-data" type="application/json">__REPORT_DATA__</script><script>
const runs=JSON.parse(document.getElementById('report-data').textContent);let selected=0;
const labels={passed:'通过',failed:'失败',skipped:'未执行',running:'执行中',pending:'等待',interrupted:'已中断'};
const el=(tag,text,cls)=>{const n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(cls)n.className=cls;return n};
const badge=s=>el('span',labels[s]||s,'status '+s);
function draw(){const run=runs[selected];if(!run)return;document.getElementById('history').replaceChildren(...runs.map((r,i)=>{const b=el('button');b.type='button';b.setAttribute('aria-pressed',i===selected);b.append(el('strong',new Date(r.checked_at).toLocaleString()),el('small',`${r.profile} · ${labels[r.status]||r.status}`));b.onclick=()=>{selected=i;draw()};return b}));document.getElementById('runBadge').replaceChildren(badge(run.status));document.getElementById('runTitle').textContent='测试用例与结果';document.getElementById('meta').textContent=`${run.id} · ${run.profile} · ${run.git_revision||'无版本信息'} · ${run.seconds||0}s`;
const counts={passed:0,failed:0,skipped:0};run.checks.forEach(g=>(g.cases||[]).forEach(c=>{if(c.status in counts)counts[c.status]++}));document.getElementById('stats').replaceChildren(...Object.entries(counts).map(([k,v])=>{const s=el('span',labels[k]+'用例');s.prepend(el('b',String(v)));return s}));
const pending=el('span','未执行检查');pending.prepend(el('b',String(run.checks.filter(g=>g.status==='skipped').length)));document.getElementById('stats').append(pending);
drawVisuals(run,counts);
const q=document.getElementById('search').value.toLowerCase(),filter=document.getElementById('filter').value,groups=document.getElementById('groups');groups.replaceChildren();
for(const g of run.checks){const all=g.cases||[];const cases=all.filter(c=>(filter==='all'||c.status===filter)&&(!q||JSON.stringify([g.name,g.description,c.id,c.name,c.detail]).toLowerCase().includes(q)));if(!cases.length&&(all.length||(filter!=='all'&&g.status!==filter)||(q&&!JSON.stringify([g.name,g.description,g.reason]).toLowerCase().includes(q))))continue;
const details=el('details',undefined,'group');details.open=g.status==='failed'||!!q;const summary=el('summary');summary.append(badge(g.status),el('strong',g.name),el('span',`${all.length} 用例 · ${g.seconds||0}s`));details.append(summary);const body=el('div',undefined,'body');body.append(el('p',g.description));if(g.reason)body.append(el('p',g.reason));if(cases.length){const table=el('table',undefined,'cases');const head=el('tr');['结果','用例 / 检查内容','耗时'].forEach(x=>head.append(el('th',x)));const thead=el('thead');thead.append(head);table.append(thead);const tbody=el('tbody');for(const c of cases){const row=el('tr'),state=el('td'),name=el('td');state.append(badge(c.status));name.append(el('span',c.name),el('code',c.id,'case-id'));if(c.detail){const d=el('details'),s=el('summary','查看原因');d.append(s,el('pre',c.detail));name.append(d)}row.append(state,name,el('td',`${c.seconds||0}s`));tbody.append(row)}table.append(tbody);body.append(table)}if(g.log_url){const a=el('a','查看完整执行日志 ↗');a.href=g.log_url;a.target='_blank';a.rel='noopener';body.append(a)}details.append(body);groups.append(details)}if(!groups.children.length)groups.append(el('div','没有匹配的用例。','empty'))}
function drawVisuals(run,counts){
const host=document.getElementById('visuals');host.replaceChildren();
const total=counts.passed+counts.failed,percent=total?Math.round(counts.passed/total*100):null;
const overview=el('section',undefined,'overview');overview.setAttribute('aria-label','已完成用例通过率');
const ring=el('div',undefined,'ring');ring.setAttribute('style',`background:conic-gradient(#65dfbd 0 ${percent||0}%, ${counts.failed?'#ed879a':'#3b5269'} ${percent||0}% 100%)`);ring.append(el('b',percent===null?'—':percent+'%'));
const caption=el('div');caption.append(el('h2','已完成用例通过率'),el('p',total?`${counts.passed} / ${total} 条检查通过`:'暂无已完成用例'),el('p','未执行与跳过不计入分母'),badge(run.status));overview.append(ring,caption);host.append(overview);
const trend=el('section',undefined,'trend');trend.append(el('h2','最近运行耗时'));const bars=el('div',undefined,'trend-bars'),recent=runs.slice(0,12).map((r,i)=>({r,i})).reverse(),max=Math.max(1,...recent.map(x=>x.r.seconds||0));
for(const {r,i} of recent){const button=el('button',undefined,'trend-bar');button.type='button';button.setAttribute('style',`height:${Math.max(8,(r.seconds||0)/max*100)}%`);button.setAttribute('data-state',r.status);button.setAttribute('aria-pressed',i===selected);const title=`${new Date(r.checked_at).toLocaleString()} · ${r.profile} · ${labels[r.status]||r.status} · ${r.seconds||0}s`;button.setAttribute('title',title);button.setAttribute('aria-label',title);button.onclick=()=>{selected=i;draw()};bars.append(button)}trend.append(bars,el('p',`较早 → 较近 · 点击切换运行 · 当前 ${run.seconds||0}s`),el('p','不同测试范围的耗时不可直接比较'));host.append(trend);
const map=el('section',undefined,'module-map');map.append(el('h2','模块检查分布'),el('p','点击模块筛选用例；色条表示用例结果，未执行模块单独标记。'));const grid=el('div',undefined,'module-grid');
for(const g of run.checks){const button=el('button',undefined,'module');button.type='button';button.setAttribute('title',g.name+' · '+(labels[g.status]||g.status));const title=el('span');title.append(el('span',g.name),el('span',labels[g.status]||g.status));button.append(title);const track=el('div',undefined,'module-track'),cases=g.cases||[];
const states=cases.length?['passed','failed','skipped'].map(state=>({state,n:cases.filter(c=>c.status===state).length})).filter(x=>x.n):[{state:g.status,n:1}];const n=states.reduce((a,x)=>a+x.n,0)||1;
for(const part of states){const segment=el('span',undefined,'module-segment');segment.setAttribute('data-state',part.state);segment.setAttribute('style',`width:${part.n/n*100}%`);track.append(segment)}button.append(track);button.onclick=()=>{document.getElementById('search').value=g.name;document.getElementById('filter').value='all';draw()};grid.append(button)}map.append(grid);const legend=el('div',undefined,'chart-legend');['通过','失败','未执行 / 跳过'].forEach(x=>legend.append(el('span',x)));map.append(legend);host.append(map);
}
document.getElementById('search').oninput=draw;document.getElementById('filter').onchange=draw;draw();
</script></html>
