name = "formrefine-staging-api"
main = "proxy.js"
compatibility_date = "2026-11-22"
workers_dev = false
preview_urls = false
routes = [
  { pattern = "staging.formrefine.ai/", zone_name = "formrefine.ai" },
  { pattern = "staging.formrefine.ai/app", zone_name = "formrefine.ai" },
  { pattern = "staging.formrefine.ai/privacy", zone_name = "formrefine.ai" },
  { pattern = "staging.formrefine.ai/guides*", zone_name = "formrefine.ai" },
  { pattern = "staging.formrefine.ai/static/*", zone_name = "formrefine.ai" },
  { pattern = "staging.formrefine.ai/template_images/*", zone_name = "formrefine.ai" },
  { pattern = "staging.formrefine.ai/api/v1/templates/*", zone_name = "formrefine.ai" },
  { pattern = "staging.formrefine.ai/api/v1/videos/*", zone_name = "formrefine.ai" },
  { pattern = "staging.formrefine.ai/api/v1/export/*", zone_name = "formrefine.ai" },
  { pattern = "staging.formrefine.ai/results/*", zone_name = "formrefine.ai" }
]
