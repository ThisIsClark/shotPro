# Attach the route only in the approved cutover window, after GeFeiSites is the custom domain origin.
name = "formrefine-production-api"
main = "../staging/proxy.js"
compatibility_date = "2026-11-22"
workers_dev = false
preview_urls = false
routes = [{ pattern = "formrefine.ai/*", zone_name = "formrefine.ai" }]

[vars]
PUBLIC_HOST = "formrefine.ai"
USE_ENGINE_ORIGIN = "true"
INDEX_PUBLIC_PAGES = "true"
# Set FASTAPI_ORIGIN to the dedicated production deployment before attaching the route.
